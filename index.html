<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>XALLO-GAMING</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #102a45, #050713 60%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: rgba(17, 24, 45, .97);
      border: 1px solid #263553;
      border-radius: 25px;
      padding: 32px 25px;
      box-shadow: 0 0 40px rgba(0,170,255,.18);
    }

    .logo {
      text-align: center;
      font-size: 34px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .logo span { color: #08a9ff; }

    .subtitle {
      text-align: center;
      color: #9da8bd;
      margin-bottom: 30px;
    }

    h2 { margin-bottom: 20px; }

    input {
      width: 100%;
      padding: 16px;
      margin-bottom: 14px;
      border-radius: 13px;
      border: 1px solid #283653;
      background: #070b19;
      color: white;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 13px;
      background: #08a9ff;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .switch {
      text-align: center;
      margin-top: 22px;
      color: #9da8bd;
    }

    .switch a {
      color: #08a9ff;
      font-weight: bold;
      cursor: pointer;
    }

    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      display: none;
    }

    .success {
      display: block;
      color: #55e6a5;
      background: rgba(0,200,120,.12);
    }

    .error {
      display: block;
      color: #ff7777;
      background: rgba(255,60,60,.12);
    }

    .dashboard {
      display: none;
      text-align: center;
    }

    .email {
      color: #b8c1d4;
      margin: 15px 0;
      word-break: break-word;
    }

    .coins {
      margin: 25px 0;
      padding: 22px;
      border-radius: 18px;
      background: #0c1b2e;
      border: 1px solid #315174;
    }

    .coin-number {
      color: #ffd54a;
      font-size: 40px;
      font-weight: bold;
      margin-top: 8px;
    }

    .logout {
      background: #e53935;
    }

    /* WHEEL */
    .wheel-wrapper {
      position: relative;
      width: 260px;
      height: 260px;
      margin: 25px auto;
    }

    .wheel-pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 32px;
      z-index: 10;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,.6));
    }

    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 6px solid #ffd54a;
      box-shadow: 0 0 40px rgba(255, 213, 74, .4);
      position: relative;
      overflow: hidden;
      transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
    }

    .wheel-sector {
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 50%;
      transform-origin: 100% 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      color: white;
      text-shadow: 0 1px 3px rgba(0,0,0,.5);
    }

    .wheel-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      background: #ffd54a;
      border-radius: 50%;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 2px 10px rgba(0,0,0,.5);
    }

    /* NAV TABS */
    .nav-tabs {
      display: flex;
      gap: 8px;
      margin: 20px 0;
      background: #0c1b2e;
      padding: 6px;
      border-radius: 14px;
    }

    .nav-tab {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      background: transparent;
      color: #9da8bd;
      font-size: 14px;
      margin: 0;
      cursor: pointer;
    }

    .nav-tab.active {
      background: #08a9ff;
      color: white;
    }

    /* SHOP */
    .shop-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 15px 0;
    }

    .card-item {
      background: #0c1b2e;
      border: 2px solid #315174;
      border-radius: 14px;
      padding: 14px 10px;
      text-align: center;
    }

    .card-icon {
      font-size: 34px;
      margin-bottom: 6px;
    }

    .card-name {
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .card-company {
      font-size: 11px;
      color: #9da8bd;
      margin-bottom: 8px;
    }

    .card-price {
      color: #ffd54a;
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 8px;
    }

    .card-buy {
      padding: 8px;
      font-size: 13px;
      margin: 0;
      background: #10b981;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN / SIGNUP -->
  <div id="authBox">

    <div class="logo">XALLO-<span>GAMING</span></div>
    <div class="subtitle">Play • Earn • Enjoy</div>

    <div id="loginBox">
      <h2>Login</h2>
      <input id="loginEmail" type="email" placeholder="Email">
      <input id="loginPassword" type="password" placeholder="Password">
      <button onclick="login()">Login</button>
      <div class="switch">
        Don't have an account?
        <a onclick="showSignup()">Sign Up</a>
      </div>
    </div>

    <div id="signupBox" style="display:none;">
      <h2>Create Account</h2>
      <input id="signupEmail" type="email" placeholder="Email">
      <input id="signupPassword" type="password" placeholder="Password">
      <button onclick="signup()">Sign Up</button>
      <div class="switch">
        Already have an account?
        <a onclick="showLogin()">Login</a>
      </div>
    </div>

    <div id="message" class="message"></div>

  </div>


  <!-- DASHBOARD -->
  <div id="dashboard" class="dashboard">

    <div class="logo">XALLO-<span>GAMING</span></div>
    <div class="subtitle">Play • Earn • Enjoy</div>

    <div class="email" id="userEmail"></div>

    <div class="coins">
      🪙 Your Coins
      <div class="coin-number" id="coins">0</div>
    </div>

    <!-- NAV TABS -->
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="showTab('home')">🏠 Home</button>
      <button class="nav-tab" onclick="showTab('shop')">🛒 Shop</button>
      <button class="nav-tab" onclick="showTab('mycards')">🎴 My Cards</button>
    </div>


    <!-- HOME TAB -->
    <div id="homeTab">

      <div class="wheel-wrapper">
        <div class="wheel-pointer">▼</div>
        <div class="wheel" id="wheel"></div>
        <div class="wheel-center">🪙</div>
      </div>

      <button onclick="spinWheel()" id="spinBtn" style="background: #8b5cf6;">
        🎡 Spin the Wheel
      </button>

      <button onclick="earnCoins()" style="background: #10b981;">
        + 10 Coins
      </button>

      <button onclick="claimDailyBonus()" style="background: #f59e0b;">
        🎁 Daily Bonus (+100)
      </button>

    </div>


    <!-- SHOP TAB -->
    <div id="shopTab" style="display:none;">
      <h2 style="margin-top: 10px;">🛒 Shop</h2>
      <p style="color: #9da8bd; font-size: 14px; margin-bottom: 10px;">
        Buy cards and get bonus coins!
      </p>
      <div id="cardsList" class="shop-grid"></div>
    </div>


    <!-- MY CARDS TAB -->
    <div id="mycardsTab" style="display:none;">
      <h2 style="margin-top: 10px;">🎴 My Cards</h2>
      <div id="myCardsList" class="shop-grid"></div>
    </div>


    <button class="logout" onclick="logout()" style="margin-top: 15px;">
      Logout
    </button>

  </div>

</div>


<script>

const SUPABASE_URL = "https://vnyprsjjmmjahkisozib.supabase.co";
const SUPABASE_KEY = "sb_publishable_ixrANIhgAIwrxkyRL94YAw_iegjwNYp";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const PRIZES = [10, 20, 50, 100, 200, 500];
const COLORS = ["#ef4444", "#f59e0b", "#10b981", "#3b82f6", "#8b5cf6", "#ec4899"];


// ============ TABS ============
function showTab(tab) {
  document.querySelectorAll(".nav-tab").forEach(t => t.classList.remove("active"));
  event.target.classList.add("active");

  document.getElementById("homeTab").style.display = tab === "home" ? "block" : "none";
  document.getElementById("shopTab").style.display = tab === "shop" ? "block" : "none";
  document.getElementById("mycardsTab").style.display = tab === "mycards" ? "block" : "none";

  if (tab === "shop") loadShop();
  if (tab === "mycards") loadMyCards();
}


// ============ WHEEL ============
function buildWheel() {
  const wheel = document.getElementById("wheel");
  wheel.innerHTML = "";
  const sliceAngle = 360 / PRIZES.length;

  PRIZES.forEach((prize, i) => {
    const sector = document.createElement("div");
    sector.className = "wheel-sector";
    sector.style.background = COLORS[i];
    sector.style.transform = `rotate(${i * sliceAngle}deg)`;
    sector.style.clipPath = "polygon(100% 100%, 100% 0, 0 0)";

    const label = document.createElement("span");
    label.textContent = prize;
    label.style.position = "absolute";
    label.style.top = "50%";
    label.style.left = "70%";
    label.style.transform = "rotate(45deg)";
    label.style.fontSize = "16px";
    label.style.fontWeight = "bold";
    sector.appendChild(label);

    wheel.appendChild(sector);
  });
}


let isSpinning = false;

async function spinWheel() {
  if (isSpinning) return;
  const email = document.getElementById("userEmail").textContent;
  if (!email) return;

  isSpinning = true;
  const btn = document.getElementById("spinBtn");
  btn.disabled = true;
  btn.textContent = "Spinning...";

  const { data, error } = await supabaseClient.rpc("spin_wheel", { user_email: email });

  if (error) {
    alert("Error: " + error.message);
    isSpinning = false;
    btn.disabled = false;
    btn.textContent = "🎡 Spin the Wheel";
    return;
  }

  if (!data.success) {
    alert("⏳ " + data.message + " (" + data.seconds_left + "s)");
    isSpinning = false;
    btn.disabled = false;
    btn.textContent = "🎡 Spin the Wheel";
    return;
  }

  const sectorAngle = 360 / PRIZES.length;
  const targetAngle = 360 * 5 + (360 - (data.prize_index * sectorAngle + sectorAngle / 2));

  const wheel = document.getElementById("wheel");
  wheel.style.transition = "transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99)";
  wheel.style.transform = `rotate(${targetAngle}deg)`;

  setTimeout(() => {
    document.getElementById("coins").textContent = data.coins;
    alert("🎉 You won " + data.prize + " Coins!");

    isSpinning = false;
    btn.disabled = false;
    btn.textContent = "🎡 Spin the Wheel";

    wheel.style.transition = "none";
    wheel.style.transform = `rotate(0deg)`;
  }, 4200);
}


// ============ SHOP ============
async function loadShop() {
  const { data, error } = await supabaseClient.from("cards").select("*").order("id");

  if (error || !data) {
    document.getElementById("cardsList").innerHTML = "<p style='color:#ff7777;'>Error loading cards</p>";
    return;
  }

  const list = document.getElementById("cardsList");
  list.innerHTML = "";

  data.forEach(card => {
    const div = document.createElement("div");
    div.className = "card-item";
    div.style.borderColor = card.color;
    div.innerHTML = `
      <div class="card-icon">${card.icon}</div>
      <div class="card-name">${card.name}</div>
      <div class="card-company">${card.company}</div>
      <div class="card-price">🪙 ${card.price}</div>
      <div style="color:#10b981; font-size:11px; margin-bottom:6px;">+${card.bonus_coins} bonus</div>
      <button class="card-buy" onclick="buyCard(${card.id}, ${card.price})">Buy</button>
    `;
    list.appendChild(div);
  });
}


async function buyCard(cardId, price) {
  const email = document.getElementById("userEmail").textContent;
  if (!email) return;

  if (!confirm("Buy this card for " + price + " Coins?")) return;

  const { data, error } = await supabaseClient.rpc("buy_card", {
    user_email: email,
    card_id_param: cardId
  });

  if (error) {
    alert("Error: " + error.message);
    return;
  }

  if (data.success) {
    document.getElementById("coins").textContent = data.coins;
    alert("🎉 " + data.message + " (+" + data.bonus + " bonus)");
    loadShop();
  } else {
    alert("❌ " + data.message);
  }
}


// ============ MY CARDS ============
async function loadMyCards() {
  const email = document.getElementById("userEmail").textContent;
  if (!email) return;

  const { data, error } = await supabaseClient
    .from("user_cards")
    .select("*, cards(*)")
    .eq("user_email", email);

  if (error || !data) {
    document.getElementById("myCardsList").innerHTML = "<p style='color:#9da8bd;'>No cards yet</p>";
    return;
  }

  const list = document.getElementById("myCardsList");
  list.innerHTML = "";

  if (data.length === 0) {
    list.innerHTML = "<p style='color:#9da8bd; grid-column: span 2;'>You don't have any cards yet. Buy some in the Shop!</p>";
    return;
  }

  data.forEach(item => {
    const card = item.cards;
    const div = document.createElement("div");
    div.className = "card-item";
    div.style.borderColor = card.color;
    div.innerHTML = `
      <div class="card-icon">${card.icon}</div>
      <div class="card-name">${card.name}</div>
      <div class="card-company">${card.company}</div>
      <div style="color:#ffd54a; font-size:12px; margin: 6px 0;">Refund: ${Math.floor(card.price * 0.7)} 🪙</div>
      <button class="card-buy" style="background:#e53935;" onclick="sellCard(${item.id})">Sell</button>
    `;
    list.appendChild(div);
  });
}


// ============ SELL CARD ============
async function sellCard(userCardId) {
  const email = document.getElementById("userEmail").textContent;
  if (!email) return;

  if (!confirm("Are you sure you want to sell this card? You'll get 70% back.")) return;

  const { data, error } = await supabaseClient.rpc("sell_card", {
    user_email: email,
    user_card_id: userCardId
  });

  if (error) {
    alert("Error: " + error.message);
    return;
  }

  if (data.success) {
    document.getElementById("coins").textContent = data.coins;
    alert("💰 " + data.message + " +" + data.refund + " Coins");
    loadMyCards();
  } else {
    alert("❌ " + data.message);
  }
}


// ============ MESSAGE ============
function showMessage(text, type) {
  const message = document.getElementById("message");
  message.textContent = text;
  message.className = "message " + type;
}


function showLogin() {
  document.getElementById("loginBox").style.display = "block";
  document.getElementById("signupBox").style.display = "none";
  document.getElementById("message").style.display = "none";
}


function showSignup() {
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("signupBox").style.display = "block";
  document.getElementById("message").style.display = "none";
}


// ============ SIGNUP ============
async function signup() {
  const email = document.getElementById("signupEmail").value.trim();
  const password = document.getElementById("signupPassword").value;

  if (!email || !password) {
    showMessage("Enter email and password.", "error");
    return;
  }
  if (password.length < 6) {
    showMessage("Password must be at least 6 characters.", "error");
    return;
  }

  const { error } = await supabaseClient.auth.signUp({ email, password });
  if (error) {
    showMessage(error.message, "error");
    return;
  }
  showMessage("Account created! Check your email if verification is required.", "success");
}


// ============ LOGIN ============
async function login() {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;

  if (!email || !password) {
    showMessage("Enter email and password.", "error");
    return;
  }

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) {
    showMessage(error.message, "error");
    return;
  }
  showDashboard(data.user);
}


// ============ DASHBOARD ============
async function showDashboard(user) {
  document.getElementById("authBox").style.display = "none";
  document.getElementById("dashboard").style.display = "block";
  document.getElementById("userEmail").textContent = user.email;

  const { data, error } = await supabaseClient
    .from("users").select("coins").eq("email", user.email).single();

  if (!error && data) {
    document.getElementById("coins").textContent = data.coins || 0;
  } else {
    await supabaseClient.from("users").insert({ email: user.email, coins: 0 });
    document.getElementById("coins").textContent = "0";
  }
}


// ============ EARN COINS ============
async function earnCoins() {
  const email = document.getElementById("userEmail").textContent;
  if (!email) return;

  const btn = event.target;
  btn.disabled = true;
  btn.textContent = "...";

  const { data, error } = await supabaseClient.rpc("add_coins", {
    user_email: email, amount: 10
  });

  if (error) {
    alert("Error: " + error.message);
    btn.disabled = false;
    btn.textContent = "+ 10 Coins";
    return;
  }

  document.getElementById("coins").textContent = data;
  btn.disabled = false;
  btn.textContent = "+ 10 Coins";
}


// ============ DAILY BONUS ============
async function claimDailyBonus() {
  const email = document.getElementById("userEmail").textContent;
  if (!email) return;

  const btn = event.target;
  btn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = "...";

  const { data, error } = await supabaseClient.rpc("claim_daily_bonus", { user_email: email });

  if (error) {
    alert("Error: " + error.message);
    btn.disabled = false;
    btn.textContent = originalText;
    return;
  }

  if (data.success) {
    document.getElementById("coins").textContent = data.coins;
    alert("🎉 " + data.message);
  } else {
    alert("⏳ " + data.message + " (" + data.hours_left + " hours left)");
  }

  btn.disabled = false;
  btn.textContent = originalText;
}


// ============ LOGOUT ============
async function logout() {
  await supabaseClient.auth.signOut();
  document.getElementById("dashboard").style.display = "none";
  document.getElementById("authBox").style.display = "block";
  showLogin();
}


// ============ CHECK USER ============
async function checkUser() {
  const { data } = await supabaseClient.auth.getUser();
  if (data.user) showDashboard(data.user);
}


// INIT
buildWheel();
checkUser();

</script>

</body>
</html>
