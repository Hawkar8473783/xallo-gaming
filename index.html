<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>XALLO-GAMING</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #102a45, #050713 60%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: rgba(17, 24, 45, .97);
      border: 1px solid #263553;
      border-radius: 25px;
      padding: 32px 25px;
      box-shadow: 0 0 40px rgba(0,170,255,.18);
    }

    .logo {
      text-align: center;
      font-size: 34px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .logo span {
      color: #08a9ff;
    }

    .subtitle {
      text-align: center;
      color: #9da8bd;
      margin-bottom: 30px;
    }

    h2 {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 16px;
      margin-bottom: 14px;
      border-radius: 13px;
      border: 1px solid #283653;
      background: #070b19;
      color: white;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 13px;
      background: #08a9ff;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .switch {
      text-align: center;
      margin-top: 22px;
      color: #9da8bd;
    }

    .switch a {
      color: #08a9ff;
      font-weight: bold;
      cursor: pointer;
    }

    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      display: none;
    }

    .success {
      display: block;
      color: #55e6a5;
      background: rgba(0,200,120,.12);
    }

    .error {
      display: block;
      color: #ff7777;
      background: rgba(255,60,60,.12);
    }

    .dashboard {
      display: none;
      text-align: center;
    }

    .email {
      color: #b8c1d4;
      margin: 15px 0;
      word-break: break-word;
    }

    .coins {
      margin: 25px 0;
      padding: 22px;
      border-radius: 18px;
      background: #0c1b2e;
      border: 1px solid #315174;
    }

    .coin-number {
      color: #ffd54a;
      font-size: 40px;
      font-weight: bold;
      margin-top: 8px;
    }

    .logout {
      background: #e53935;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN / SIGNUP -->
  <div id="authBox">

    <div class="logo">
      XALLO-<span>GAMING</span>
    </div>

    <div class="subtitle">
      Play • Earn • Enjoy
    </div>

    <div id="loginBox">

      <h2>Login</h2>

      <input
        id="loginEmail"
        type="email"
        placeholder="Email"
      >

      <input
        id="loginPassword"
        type="password"
        placeholder="Password"
      >

      <button onclick="login()">
        Login
      </button>

      <div class="switch">
        Don't have an account?
        <a onclick="showSignup()">Sign Up</a>
      </div>

    </div>


    <div id="signupBox" style="display:none;">

      <h2>Create Account</h2>

      <input
        id="signupEmail"
        type="email"
        placeholder="Email"
      >

      <input
        id="signupPassword"
        type="password"
        placeholder="Password"
      >

      <button onclick="signup()">
        Sign Up
      </button>

      <div class="switch">
        Already have an account?
        <a onclick="showLogin()">Login</a>
      </div>

    </div>

    <div id="message" class="message"></div>

  </div>


  <!-- DASHBOARD -->
  <div id="dashboard" class="dashboard">

    <div class="logo">
      XALLO-<span>GAMING</span>
    </div>

    <div class="subtitle">
      Play • Earn • Enjoy
    </div>

    <h2>Welcome 🎮</h2>

    <div class="email" id="userEmail"></div>

    <div class="coins">
      🪙 Your Coins
      <div class="coin-number" id="coins">
        0
      </div>
    </div>

    <button onclick="earnCoins()" style="background: #10b981;">
      + 10 Coins
    </button>

    <button class="logout" onclick="logout()" style="margin-top: 10px;">
      Logout
    </button>

  </div>

</div>


<script>

const SUPABASE_URL =
"https://vnyprsjjmmjahkisozib.supabase.co";

const SUPABASE_KEY =
"sb_publishable_ixrANIhgAIwrxkyRL94YAw_iegjwNYp";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


// MESSAGE
function showMessage(text, type) {

  const message =
  document.getElementById("message");

  message.textContent = text;

  message.className =
  "message " + type;
}


// SHOW LOGIN
function showLogin() {

  document.getElementById("loginBox")
    .style.display = "block";

  document.getElementById("signupBox")
    .style.display = "none";

  document.getElementById("message")
    .style.display = "none";
}


// SHOW SIGNUP
function showSignup() {

  document.getElementById("loginBox")
    .style.display = "none";

  document.getElementById("signupBox")
    .style.display = "block";

  document.getElementById("message")
    .style.display = "none";
}


// SIGN UP
async function signup() {

  const email =
  document.getElementById("signupEmail")
    .value.trim();

  const password =
  document.getElementById("signupPassword")
    .value;

  if (!email || !password) {

    showMessage(
      "Enter email and password.",
      "error"
    );

    return;
  }

  if (password.length < 6) {

    showMessage(
      "Password must be at least 6 characters.",
      "error"
    );

    return;
  }

  const { data, error } =
  await supabaseClient.auth.signUp({
    email: email,
    password: password
  });

  if (error) {

    showMessage(
      error.message,
      "error"
    );

    return;
  }

  showMessage(
    "Account created! Check your email if verification is required.",
    "success"
  );
}


// LOGIN
async function login() {

  const email =
  document.getElementById("loginEmail")
    .value.trim();

  const password =
  document.getElementById("loginPassword")
    .value;

  if (!email || !password) {

    showMessage(
      "Enter email and password.",
      "error"
    );

    return;
  }

  const { data, error } =
  await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {

    showMessage(
      error.message,
      "error"
    );

    return;
  }

  showDashboard(data.user);
}


// DASHBOARD
async function showDashboard(user) {

  document.getElementById("authBox")
    .style.display = "none";

  document.getElementById("dashboard")
    .style.display = "block";

  document.getElementById("userEmail")
    .textContent = user.email;

  // Load coins
  const { data, error } =
  await supabaseClient
    .from("users")
    .select("coins")
    .eq("email", user.email)
    .single();

  if (!error && data) {

    document.getElementById("coins")
      .textContent = data.coins || 0;

  } else {

    // ئەگەر بەکارهێنەرەکە نەبوو، دروستی بکە
    await supabaseClient
      .from("users")
      .insert({ email: user.email, coins: 0 });

    document.getElementById("coins")
      .textContent = "0";
  }
}


// EARN COINS
async function earnCoins() {

  const email =
  document.getElementById("userEmail")
    .textContent;

  if (!email) return;

  const btn = event.target;
  btn.disabled = true;
  btn.textContent = "...";

  const { data, error } =
  await supabaseClient.rpc(
    "add_coins",
    {
      user_email: email,
      amount: 10
    }
  );

  if (error) {

    alert("Error: " + error.message);

    btn.disabled = false;
    btn.textContent = "+ 10 Coins";

    return;
  }

  document.getElementById("coins")
    .textContent = data;

  btn.disabled = false;
  btn.textContent = "+ 10 Coins";
}


// LOGOUT
async function logout() {

  await supabaseClient.auth.signOut();

  document.getElementById("dashboard")
    .style.display = "none";

  document.getElementById("authBox")
    .style.display = "block";

  showLogin();
}


// CHECK USER
async function checkUser() {

  const { data } =
  await supabaseClient.auth.getUser();

  if (data.user) {

    showDashboard(data.user);

  }
}

checkUser();

</script>

</body>
</html>
