<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>XALLO-GAMING | TikTok Feed</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* بەشی سەرەکی ڤیدیۆکان */
        .video-feed {
            height: 100vh;
            width: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }

        .video-feed::-webkit-scrollbar {
            display: none;
        }

        .video-card {
            position: relative;
            height: 100vh;
            width: 100%;
            scroll-snap-align: start;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #111;
            overflow: hidden;
        }

        .video-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* بەشی زانیارییەکان (ناو، وەسف، دوگمەکان) */
        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            z-index: 2;
            display: flex;
            justify-content: space-between;
            padding: 15px; /* بۆشایی کەمکرایەوە */
            padding-bottom: calc(20px + env(safe-area-inset-bottom)); 
            pointer-events: none;
        }

        .overlay * {
            pointer-events: auto;
        }

        /* بەشی ناو و وەسف (لای چەپ) */
        .user-info {
            width: 70%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 5px; /* بۆشایی کەمکرایەوە */
            margin-bottom: 10px; /* بۆشایی کەمکرایەوە */
            text-align: right;
        }

        .username {
            font-size: 0.9rem; /* فۆنت بچووککرایەوە */
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .caption {
            font-size: 0.75rem; /* فۆنت بچووککرایەوە */
            line-height: 1.3;
            color: #eee;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            display: -webkit-box;
            -webkit-line-clamp: 2; /* تەنها ٢ دێر پیشان بدە */
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* بەشی دوگمەکان (لای ڕاست) */
        .action-buttons {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            gap: 12px; /* بۆشایی کەمکرایەوە */
            margin-bottom: 10px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            font-size: 1.1rem; /* ئایکۆن بچووککرایەوە */
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            border-radius: 50%;
            width: 38px; /* قەبارە بچووککرایەوە */
            height: 38px; /* قەبارە بچووککرایەوە */
            justify-content: center;
            backdrop-filter: blur(5px);
            transition: transform 0.2s, background 0.2s;
        }

        .action-btn:active {
            transform: scale(0.9);
        }

        .action-btn span {
            font-size: 0.6rem; /* فۆنتی ژمارەکان بچووککرایەوە */
            font-weight: bold;
        }

        /* دوگمەی فۆڵۆ */
        .follow-btn {
            background: #fe2c55;
            border-radius: 50%;
            width: 35px; /* قەبارە بچووککرایەوە */
            height: 35px;
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(254, 44, 85, 0.5);
        }

        .follow-btn.following {
            background: #333;
            color: #fff;
            box-shadow: none;
        }

        /* دوگمەکانی سەرەوە (دەنگ) */
        .top-controls {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 3;
            display: flex;
            gap: 10px;
            padding-top: env(safe-area-inset-top); 
        }

        .top-btn {
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: white;
            font-size: 1.2rem; /* ئایکۆن بچووککرایەوە */
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <!-- کۆنترۆڵەکانی سەرەوە (دەنگ) -->
    <div class="top-controls">
        <button class="top-btn" id="muteBtn" onclick="toggleMute()">🔇</button>
    </div>

    <!-- بەشی ڤیدیۆکان -->
    <div class="video-feed" id="videoFeed">
        
        <!-- ڤیدیۆی یەکەم -->
        <div class="video-card">
            <video src="https://www.w3schools.com/html/mov_bbb.mp4" loop playsinline muted></video>
            
            <div class="overlay">
                <div class="user-info">
                    <div class="username">
                        <span>👤</span> XALLO_GAMER
                    </div>
                    <div class="caption">
                        یەکەم ڤیدیۆی من لە XALLO-GAMING! 🎮🔥 #گەیمینگ #XALLO
                    </div>
                </div>
                
                <div class="action-buttons">
                    <button class="follow-btn" onclick="toggleFollow(this)">+</button>
                    <button class="action-btn" onclick="likeVideo(this)">
                        ❤️ <span>1.2K</span>
                    </button>
                    <button class="action-btn" onclick="openComments()">
                        💬 <span>45</span>
                    </button>
                    <button class="action-btn" onclick="shareVideo()">
                        ↗️ <span>Share</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- ڤیدیۆی دووەم -->
        <div class="video-card">
            <video src="https://www.w3schools.com/html/movie.mp4" loop playsinline muted></video>
            
            <div class="overlay">
                <div class="user-info">
                    <div class="username">
                        <span>👤</span> PRO_GAMER
                    </div>
                    <div class="caption">
                        یارییەکی زۆر سەخت! 🕹️ ئەتوانی بیبەیت؟ #چالێنج
                    </div>
                </div>
                
                <div class="action-buttons">
                    <button class="follow-btn" onclick="toggleFollow(this)">+</button>
                    <button class="action-btn" onclick="likeVideo(this)">
                        ❤️ <span>3.5K</span>
                    </button>
                    <button class="action-btn" onclick="openComments()">
                        💬 <span>120</span>
                    </button>
                    <button class="action-btn" onclick="shareVideo()">
                        ↗️ <span>Share</span>
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ١. کۆنترۆڵی دەنگ (Mute / Unmute)
        let isMuted = true; // بە شێوەی سەرەتایی دەنگ لابراوە بۆ ئەوەی ڤیدیۆکان خۆکارانە لێبدرێن
        const videos = document.querySelectorAll('video');
        const muteBtn = document.getElementById('muteBtn');

        function toggleMute() {
            isMuted = !isMuted;
            videos.forEach(video => {
                video.muted = isMuted;
            });
            muteBtn.textContent = isMuted ? '🔇' : '🔊';
        }

        // ٢. خۆکارکردنەوەی ڤیدیۆکان کاتێک دێنە سەر شاشە (Auto-play)
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const video = entry.target.querySelector('video');
                if (entry.isIntersecting) {
                    video.play().catch(e => {
                        console.log("پێویستە بەکارهێنەر کلیک بکات بۆ لێدان");
                        video.muted = true; 
                        isMuted = true;
                        muteBtn.textContent = '🔇';
                    });
                } else {
                    video.pause();
                    video.currentTime = 0; 
                }
            });
        }, { threshold: 0.6 });

        document.querySelectorAll('.video-card').forEach(card => {
            observer.observe(card);
        });

        // ٣. لایککردن
        function likeVideo(btn) {
            const isLiked = btn.style.color === 'red';
            if (isLiked) {
                btn.style.color = 'white';
                let span = btn.querySelector('span');
                let num = parseFloat(span.textContent);
                if (span.textContent.includes('K')) num = num * 1000;
                num -= 1;
                span.textContent = num >= 1000 ? (num/1000).toFixed(1) + 'K' : num;
            } else {
                btn.style.color = 'red';
                let span = btn.querySelector('span');
                let num = parseFloat(span.textContent);
                if (span.textContent.includes('K')) num = num * 1000;
                num += 1;
                span.textContent = num >= 1000 ? (num/1000).toFixed(1) + 'K' : num;
            }
        }

        // ٤. فۆڵۆکردن
        function toggleFollow(btn) {
            if (btn.textContent === '+') {
                btn.textContent = '✓';
                btn.classList.add('following');
            } else {
                btn.textContent = '+';
                btn.classList.remove('following');
            }
        }

        // ٥. کۆمێنت و شێر
        function openComments() {
            alert("بەشی کۆمێنتەکان لە داهاتوودا دروست دەکرێت!");
        }

        function shareVideo() {
            alert("بەشی هاوبەشکردن لە داهاتوودا دروست دەکرێت!");
        }
    </script>

</body>
</html>
