<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XALLO-GAMING | TikTok Feed</title>
    <style>
        /* ڕێکخستنی گشتی */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            overflow: hidden; /* ڕاگرتنی سکرۆلی ئاسایی */
            height: 100vh;
            width: 100vw;
        }

        /* بەشی سەرەکی ڤیدیۆکان */
        .video-feed {
            height: 100vh;
            width: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none; /* شاردنەوەی سکرۆڵبار لە فایەرفۆکس */
        }

        .video-feed::-webkit-scrollbar {
            display: none; /* شاردنەوەی سکرۆڵبار لە کرۆم */
        }

        /* کارتی ڤیدیۆ */
        .video-card {
            position: relative;
            height: 100vh;
            width: 100%;
            scroll-snap-align: start;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #111;
        }

        /* ڤیدیۆکە خۆی */
        .video-card video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* بۆ پڕکردنەوەی شاشەکە */
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* بەشی زانیارییەکان (ناو، وەسف، دوگمەکان) */
        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            z-index: 2;
            display: flex;
            justify-content: space-between;
            padding: 20px;
            pointer-events: none; /* بۆ ئەوەی کلیک لەسەر ڤیدیۆ کار بکات */
        }

        .overlay * {
            pointer-events: auto; /* چالاککردنەوەی کلیک بۆ ناوەوە */
        }

        /* بەشی چەپ (ناو و وەسف) */
        .user-info {
            width: 70%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 20px;
        }

        .username {
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .caption {
            font-size: 0.95rem;
            line-height: 1.4;
            color: #ddd;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* بەشی ڕاست (دوگمەکان) */
        .action-buttons {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            justify-content: center;
            transition: transform 0.2s;
        }

        .action-btn:hover {
            transform: scale(1.1);
        }

        .action-btn span {
            font-size: 0.7rem;
            font-weight: bold;
        }

        /* دوگمەی فۆڵۆ */
        .follow-btn {
            background: #fe2c55;
            border-radius: 5px;
            width: 40px;
            height: 40px;
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            border: none;
            cursor: pointer;
            margin-bottom: 5px;
        }

        .follow-btn.following {
            background: #333;
            color: #fff;
        }

        /* دوگمەکانی سەرەوە (دەنگ و گەورەکردن) */
        .top-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 3;
            display: flex;
            gap: 15px;
        }

        .top-btn {
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: white;
            font-size: 1.5rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* شاردنەوەی دوگمەی دەنگ کاتێک ڤیدیۆ دەنگ نییە */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- کۆنترۆڵەکانی سەرەوە (دەنگ) -->
    <div class="top-controls">
        <button class="top-btn" id="muteBtn" onclick="toggleMute()">🔊</button>
    </div>

    <!-- بەشی ڤیدیۆکان -->
    <div class="video-feed" id="videoFeed">
        
        <!-- ڤیدیۆی یەکەم -->
        <div class="video-card">
            <!-- لە جیاتی لینکی نموونە، لینکی ڤیدیۆکەت لێرە دابنێ -->
            <video src="https://www.w3schools.com/html/mov_bbb.mp4" loop playsinline></video>
            
            <div class="overlay">
                <div class="user-info">
                    <div class="username">
                        <span>👤</span> XALLO_GAMER
                    </div>
                    <div class="caption">
                        یەکەم ڤیدیۆی من لە XALLO-GAMING! 🎮🔥 #گەیمینگ #XALLO
                    </div>
                </div>
                
                <div class="action-buttons">
                    <button class="follow-btn" onclick="toggleFollow(this)">+</button>
                    <button class="action-btn" onclick="likeVideo(this)">
                        ❤️ <span>1.2K</span>
                    </button>
                    <button class="action-btn" onclick="openComments()">
                        💬 <span>45</span>
                    </button>
                    <button class="action-btn" onclick="shareVideo()">
                        ↗️ <span>Share</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- ڤیدیۆی دووەم (بۆ تاقیکردنەوەی سکرۆڵ) -->
        <div class="video-card">
            <video src="https://www.w3schools.com/html/movie.mp4" loop playsinline></video>
            
            <div class="overlay">
                <div class="user-info">
                    <div class="username">
                        <span>👤</span> PRO_GAMER
                    </div>
                    <div class="caption">
                        یارییەکی زۆر سەخت! 🕹️ ئەتوانی بیبەیت؟ #چالێنج
                    </div>
                </div>
                
                <div class="action-buttons">
                    <button class="follow-btn" onclick="toggleFollow(this)">+</button>
                    <button class="action-btn" onclick="likeVideo(this)">
                        ❤️ <span>3.5K</span>
                    </button>
                    <button class="action-btn" onclick="openComments()">
                        💬 <span>120</span>
                    </button>
                    <button class="action-btn" onclick="shareVideo()">
                        ↗️ <span>Share</span>
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ١. کۆنترۆڵی دەنگ (Mute / Unmute)
        let isMuted = false;
        const videos = document.querySelectorAll('video');
        const muteBtn = document.getElementById('muteBtn');

        function toggleMute() {
            isMuted = !isMuted;
            videos.forEach(video => {
                video.muted = isMuted;
            });
            muteBtn.textContent = isMuted ? '🔇' : '🔊';
        }

        // ٢. خۆکارکردنەوەی ڤیدیۆکان کاتێک دێنە سەر شاشە (Auto-play)
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const video = entry.target.querySelector('video');
                if (entry.isIntersecting) {
                    video.play().catch(e => console.log("پێویستە بەکارهێنەر کلیک بکات بۆ لێدان"));
                    // دڵنیابوونەوە لەوەی دەنگەکە لەسەر حاڵەتی ئێستایە
                    video.muted = isMuted; 
                } else {
                    video.pause();
                    video.currentTime = 0; // گەڕاندنەوە بۆ سەرەتا
                }
            });
        }, { threshold: 0.6 }); // کاتێک ٦٠٪ ی ڤیدیۆکە دیار بوو، لێیبدە

        document.querySelectorAll('.video-card').forEach(card => {
            observer.observe(card);
        });

        // ٣. لایککردن
        function likeVideo(btn) {
            btn.style.color = btn.style.color === 'red' ? 'white' : 'red';
        }

        // ٤. فۆڵۆکردن
        function toggleFollow(btn) {
            if (btn.textContent === '+') {
                btn.textContent = '✓';
                btn.classList.add('following');
            } else {
                btn.textContent = '+';
                btn.classList.remove('following');
            }
        }

        // ٥. کۆمێنت و شێر (بۆ ئێستا تەنها ئاگادارکردنەوە)
        function openComments() {
            alert("بەشی کۆمێنتەکان لە داهاتوودا دروست دەکرێت!");
        }

        function shareVideo() {
            alert("بەشی هاوبەشکردن لە داهاتوودا دروست دەکرێت!");
        }
    </script>

</body>
</html>
