<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>XALLO-GAMING</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #102a45, #050713 55%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: rgba(17, 24, 45, 0.96);
      border: 1px solid #263553;
      border-radius: 25px;
      padding: 35px 28px;
      box-shadow: 0 0 40px rgba(0, 170, 255, 0.18);
    }

    .logo {
      text-align: center;
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .logo span {
      color: #08a9ff;
    }

    .subtitle {
      text-align: center;
      color: #9da8bd;
      font-size: 18px;
      margin-bottom: 35px;
    }

    h2 {
      margin-bottom: 20px;
      font-size: 28px;
    }

    input {
      width: 100%;
      padding: 17px;
      margin-bottom: 15px;
      border-radius: 14px;
      border: 1px solid #283653;
      background: #070b19;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #08a9ff;
      box-shadow: 0 0 10px rgba(8,169,255,.2);
    }

    button {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 14px;
      background: #08a9ff;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button:hover {
      background: #078fd7;
    }

    .switch {
      text-align: center;
      margin-top: 25px;
      color: #9da8bd;
      font-size: 16px;
    }

    .switch a {
      color: #08a9ff;
      cursor: pointer;
      font-weight: bold;
    }

    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      display: none;
    }

    .success {
      display: block;
      background: rgba(0, 200, 120, .12);
      color: #55e6a5;
    }

    .error {
      display: block;
      background: rgba(255, 60, 60, .12);
      color: #ff7777;
    }

    .dashboard {
      display: none;
      text-align: center;
    }

    .dashboard h2 {
      color: #08a9ff;
    }

    .email {
      color: #b8c1d4;
      margin: 15px 0 20px;
      word-break: break-word;
    }

    .coins-box {
      background: linear-gradient(135deg, #172b48, #0b1628);
      border: 1px solid #315174;
      border-radius: 18px;
      padding: 22px;
      margin: 20px 0 25px;
      box-shadow: 0 0 25px rgba(8,169,255,.12);
    }

    .coins-title {
      color: #9da8bd;
      font-size: 15px;
      margin-bottom: 8px;
    }

    .coins-number {
      color: #ffd54a;
      font-size: 38px;
      font-weight: bold;
    }

    .coins-icon {
      font-size: 30px;
    }

    .logout {
      background: #e53935;
    }

    .logout:hover {
      background: #c62828;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- AUTH -->
    <div id="authBox">

      <div class="logo">
        XALLO-<span>GAMING</span>
      </div>

      <div class="subtitle">
        Play • Earn • Enjoy
      </div>

      <!-- LOGIN -->
      <div id="loginBox">

        <h2>Login</h2>

        <input
          type="email"
          id="loginEmail"
          placeholder="Email"
          autocomplete="email"
        >

        <input
          type="password"
          id="loginPassword"
          placeholder="Password"
          autocomplete="current-password"
        >

        <button onclick="login()">
          Login
        </button>

        <div class="switch">
          Don't have an account?
          <a onclick="showSignup()">Sign Up</a>
        </div>

      </div>

      <!-- SIGN UP -->
      <div id="signupBox" style="display:none;">

        <h2>Create Account</h2>

        <input
          type="email"
          id="signupEmail"
          placeholder="Email"
          autocomplete="email"
        >

        <input
          type="password"
          id="signupPassword"
          placeholder="Password"
          autocomplete="new-password"
        >

        <button onclick="signup()">
          Sign Up
        </button>

        <div class="switch">
          Already have an account?
          <a onclick="showLogin()">Login</a>
        </div>

      </div>

      <div id="message" class="message"></div>

    </div>


    <!-- DASHBOARD -->
    <div id="dashboard" class="dashboard">

      <div class="logo">
        XALLO-<span>GAMING</span>
      </div>

      <div class="subtitle">
        Play • Earn • Enjoy
      </div>

      <h2>Welcome 🎮</h2>

      <p class="email" id="userEmail"></p>

      <!-- COINS -->
      <div class="coins-box">

        <div class="coins-icon">
          🪙
        </div>

        <div class="coins-title">
          Your Coins
        </div>

        <div class="coins-number" id="coins">
          0
        </div>

      </div>

      <button class="logout" onclick="logout()">
        Logout
      </button>

    </div>

  </div>


<script>

  // ==============================
  // SUPABASE CONFIG
  // ==============================

  const SUPABASE_URL =
    "https://vnyprsjjmmjahkisozib.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_ixrANIhgAIwrxkyRL94YAw_iegjwNYp";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==============================
  // MESSAGE
  // ==============================

  function showMessage(text, type) {

    const message =
      document.getElementById("message");

    message.textContent = text;

    message.className =
      "message " + type;

  }


  // ==============================
  // SHOW LOGIN
  // ==============================

  function showLogin() {

    document.getElementById("loginBox")
      .style.display = "block";

    document.getElementById("signupBox")
      .style.display = "none";

    document.getElementById("message")
      .style.display = "none";
  }


  // ==============================
  // SHOW SIGN UP
  // ==============================

  function showSignup() {

    document.getElementById("loginBox")
      .style.display = "none";

    document.getElementById("signupBox")
      .style.display = "block";

    document.getElementById("message")
      .style.display = "none";
  }


  // ==============================
  // CREATE USER PROFILE
  // ==============================

  async function createUserProfile(user) {

    const username =
      user.email
        ? user.email.split("@")[0]
        : "Player";

    const { error } =
      await supabaseClient
        .from("users")
        .upsert({
          email: user.email,
          username: username
        }, {
          onConflict: "email"
        });

    if (error) {
      console.log("Profile error:", error);
    }
  }


  // ==============================
  // LOAD COINS
  // ==============================

  async function loadCoins(user) {

    const { data, error } =
      await supabaseClient
        .from("users")
        .select("coins")
        .eq("email", user.email)
        .single();

    if (error) {

      console.log("Coins error:", error);

      document.getElementById("coins")
        .textContent = "0";

      return;
    }

    document.getElementById("coins")
      .textContent = data.coins || 0;
  }


  // ==============================
  // SIGN UP
  // ==============================

  async function signup() {

    const email =
      document.getElementById("signupEmail")
        .value.trim();

    const password =
      document.getElementById("signupPassword")
        .value;


    if (!email || !password) {

      showMessage(
        "Please enter email and password.",
        "error"
      );

      return;
    }


    if (password.length < 6) {

      showMessage(
        "Password must be at least 6 characters.",
        "error"
      );

      return;
    }


    const { data, error } =
      await supabaseClient.auth.signUp({
        email: email,
        password: password
      });


    if (error) {

      showMessage(
        error.message,
        "error"
      );

      return;
    }


    if (data.user && data.session) {

      await createUserProfile(data.user);

      showDashboard(data.user);

    } else {

      showMessage(
        "Account created! Check your email if verification is required.",
        "success"
      );

    }

  }


  // ==============================
  // LOGIN
  // ==============================

  async function login() {

    const email =
      document.getElementById("loginEmail")
        .value.trim();

    const password =
      document.getElementById("loginPassword")
        .value;


    if (!email || !password) {

      showMessage(
        "Please enter email and password.",
        "error"
      );

      return;
    }


    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });


    if (error) {

      showMessage(
        error.message,
        "error"
      );

      return;
    }


    await createUserProfile(data.user);

    showDashboard(data.user);

  }


  // ==============================
  // DASHBOARD
  // ==============================

  async function showDashboard(user) {

    document.getElementById("authBox")
      .style.display = "none";

    document.getElementById("dashboard")
      .style.display = "block";

    document.getElementById("userEmail")
      .textContent = user.email;

    await loadCoins(user);

  }


  // ==============================
  // LOGOUT
  // ==============================

  async function logout() {

    await supabaseClient.auth.signOut();

    document.getElementById("dashboard")
      .style.display = "none";

    document.getElementById("authBox")
      .style.display = "block";

    showLogin();

  }


  // ==============================
  // CHECK CURRENT USER
  // ==============================

  async function checkUser() {

    const { data } =
      await supabaseClient.auth.getUser();

    if (data.user) {

      await createUserProfile(data.user);

      showDashboard(data.user);

    }

  }


  checkUser();

</script>

</body>
</html>
