<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>XALLO-GAMING</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #12385a, #050713 60%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: rgba(17, 24, 45, 0.97);
      border: 1px solid #263553;
      border-radius: 25px;
      padding: 32px 25px;
      box-shadow: 0 0 40px rgba(0, 170, 255, .18);
    }

    .logo {
      text-align: center;
      font-size: 34px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .logo span {
      color: #08a9ff;
    }

    .subtitle {
      text-align: center;
      color: #9da8bd;
      margin-bottom: 30px;
    }

    h2 {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 16px;
      margin-bottom: 14px;
      border-radius: 13px;
      border: 1px solid #283653;
      background: #070b19;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #08a9ff;
    }

    button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 13px;
      background: #08a9ff;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button:active {
      transform: scale(.98);
    }

    .switch {
      text-align: center;
      margin-top: 22px;
      color: #9da8bd;
    }

    .switch a {
      color: #08a9ff;
      font-weight: bold;
      cursor: pointer;
    }

    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      display: none;
      line-height: 1.5;
    }

    .success {
      display: block;
      color: #55e6a5;
      background: rgba(0, 200, 120, .12);
    }

    .error {
      display: block;
      color: #ff7777;
      background: rgba(255, 60, 60, .12);
    }

    .dashboard {
      display: none;
      text-align: center;
    }

    .email {
      color: #b8c1d4;
      margin: 15px 0;
      word-break: break-word;
    }

    .coins {
      margin: 25px 0 15px;
      padding: 22px;
      border-radius: 18px;
      background: #0c1b2e;
      border: 1px solid #315174;
    }

    .coin-number {
      color: #ffd54a;
      font-size: 40px;
      font-weight: bold;
      margin-top: 8px;
    }

    .coin-button {
      background: #16b978;
      margin-bottom: 12px;
    }

    .coin-button:hover {
      background: #13a86c;
    }

    .logout {
      background: #e53935;
    }

    .logout:hover {
      background: #c62828;
    }

    .loading {
      opacity: .7;
      pointer-events: none;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- AUTH -->
  <div id="authBox">

    <div class="logo">
      XALLO-<span>GAMING</span>
    </div>

    <div class="subtitle">
      Play • Earn • Enjoy
    </div>

    <!-- LOGIN -->
    <div id="loginBox">

      <h2>Login</h2>

      <input
        id="loginEmail"
        type="email"
        placeholder="Email"
        autocomplete="email"
      >

      <input
        id="loginPassword"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button id="loginButton" onclick="login()">
        Login
      </button>

      <div class="switch">
        Don't have an account?
        <a onclick="showSignup()">Sign Up</a>
      </div>

    </div>

    <!-- SIGN UP -->
    <div id="signupBox" style="display:none;">

      <h2>Create Account</h2>

      <input
        id="signupEmail"
        type="email"
        placeholder="Email"
        autocomplete="email"
      >

      <input
        id="signupPassword"
        type="password"
        placeholder="Password"
        autocomplete="new-password"
      >

      <button id="signupButton" onclick="signup()">
        Sign Up
      </button>

      <div class="switch">
        Already have an account?
        <a onclick="showLogin()">Login</a>
      </div>

    </div>

    <div id="message" class="message"></div>

  </div>


  <!-- DASHBOARD -->
  <div id="dashboard" class="dashboard">

    <div class="logo">
      XALLO-<span>GAMING</span>
    </div>

    <div class="subtitle">
      Play • Earn • Enjoy
    </div>

    <h2>Welcome 🎮</h2>

    <div class="email" id="userEmail"></div>

    <div class="coins">
      🪙 Your Coins

      <div class="coin-number" id="coins">
        0
      </div>
    </div>

    <button
      class="coin-button"
      id="coinButton"
      onclick="addCoins()"
    >
      🎁 Get 10 Coins
    </button>

    <button
      class="logout"
      onclick="logout()"
    >
      Logout
    </button>

    <div
      id="dashboardMessage"
      class="message"
    ></div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://vnyprsjjmmjahkisozib.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_ixrANIhgAIwrxkyRL94YAw_iegjwNYp";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


// ================================
// MESSAGE
// ================================

function showMessage(text, type) {

  const message =
    document.getElementById("message");

  message.textContent = text;

  message.className =
    "message " + type;
}


// DASHBOARD MESSAGE

function showDashboardMessage(text, type) {

  const message =
    document.getElementById("dashboardMessage");

  message.textContent = text;

  message.className =
    "message " + type;
}


// ================================
// SHOW LOGIN
// ================================

function showLogin() {

  document.getElementById("loginBox")
    .style.display = "block";

  document.getElementById("signupBox")
    .style.display = "none";

  document.getElementById("message")
    .style.display = "none";
}


// ================================
// SHOW SIGNUP
// ================================

function showSignup() {

  document.getElementById("loginBox")
    .style.display = "none";

  document.getElementById("signupBox")
    .style.display = "block";

  document.getElementById("message")
    .style.display = "none";
}


// ================================
// SIGN UP
// ================================

async function signup() {

  const email =
    document.getElementById("signupEmail")
      .value.trim();

  const password =
    document.getElementById("signupPassword")
      .value;


  if (!email || !password) {

    showMessage(
      "Enter email and password.",
      "error"
    );

    return;
  }


  if (password.length < 6) {

    showMessage(
      "Password must be at least 6 characters.",
      "error"
    );

    return;
  }


  const button =
    document.getElementById("signupButton");

  button.classList.add("loading");
  button.textContent = "Creating...";


  const { data, error } =
    await supabaseClient.auth.signUp({
      email: email,
      password: password
    });


  button.classList.remove("loading");
  button.textContent = "Sign Up";


  if (error) {

    showMessage(
      error.message,
      "error"
    );

    return;
  }


  showMessage(
    "Account created successfully! 🎉",
    "success"
  );


  // Create profile
  await createUserProfile(email);


  // Clear inputs
  document.getElementById("signupEmail")
    .value = "";

  document.getElementById("signupPassword")
    .value = "";
}


// ================================
// CREATE USER PROFILE
// ================================

async function createUserProfile(email) {

  const username =
    email.split("@")[0];


  const { error } =
    await supabaseClient
      .from("users")
      .upsert(
        {
          email: email,
          username: username,
          coins: 0
        },
        {
          onConflict: "email"
        }
      );


  if (error) {

    console.log(
      "Profile error:",
      error.message
    );
  }
}


// ================================
// LOGIN
// ================================

async function login() {

  const email =
    document.getElementById("loginEmail")
      .value.trim();

  const password =
    document.getElementById("loginPassword")
      .value;


  if (!email || !password) {

    showMessage(
      "Enter email and password.",
      "error"
    );

    return;
  }


  const button =
    document.getElementById("loginButton");

  button.classList.add("loading");
  button.textContent = "Logging in...";


  const { data, error } =
    await supabaseClient.auth
      .signInWithPassword({
        email: email,
        password: password
      });


  button.classList.remove("loading");
  button.textContent = "Login";


  if (error) {

    showMessage(
      error.message,
      "error"
    );

    return;
  }


  if (data.user) {

    await createUserProfile(
      data.user.email
    );

    showDashboard(data.user);
  }
}


// ================================
// LOAD COINS
// ================================

async function loadCoins(user) {

  const { data, error } =
    await supabaseClient
      .from("users")
      .select("coins")
      .eq("email", user.email)
      .single();


  if (!error && data) {

    document.getElementById("coins")
      .textContent =
        data.coins || 0;

  } else {

    document.getElementById("coins")
      .textContent = "0";
  }
}


// ================================
// DASHBOARD
// ================================

async function showDashboard(user) {

  document.getElementById("authBox")
    .style.display = "none";

  document.getElementById("dashboard")
    .style.display = "block";

  document.getElementById("userEmail")
    .textContent = user.email;


  await createUserProfile(
    user.email
  );


  await loadCoins(user);
}


// ================================
// ADD 10 COINS
// ================================

async function addCoins() {

  const { data: userData, error: userError } =
    await supabaseClient.auth.getUser();


  if (
    userError ||
    !userData.user
  ) {

    showDashboardMessage(
      "Please login first.",
      "error"
    );

    return;
  }


  const email =
    userData.user.email;


  const button =
    document.getElementById("coinButton");

  button.classList.add("loading");
  button.textContent = "Adding...";


  const { data, error } =
    await supabaseClient
      .from("users")
      .select("coins")
      .eq("email", email)
      .single();


  if (error || !data) {

    button.classList.remove("loading");
    button.textContent = "🎁 Get 10 Coins";

    showDashboardMessage(
      "User profile not found.",
      "error"
    );

    return;
  }


  const currentCoins =
    Number(data.coins) || 0;

  const newCoins =
    currentCoins + 10;


  const { error: updateError } =
    await supabaseClient
      .from("users")
      .update({
        coins: newCoins
      })
      .eq("email", email);


  button.classList.remove("loading");
  button.textContent = "🎁 Get 10 Coins";


  if (updateError) {

    showDashboardMessage(
      updateError.message,
      "error"
    );

    return;
  }


  document.getElementById("coins")
    .textContent = newCoins;


  showDashboardMessage(
    "🎉 10 Coins added successfully!",
    "success"
  );
}


// ================================
// LOGOUT
// ================================

async function logout() {

  await supabaseClient.auth.signOut();


  document.getElementById("dashboard")
    .style.display = "none";

  document.getElementById("authBox")
    .style.display = "block";


  document.getElementById("dashboardMessage")
    .style.display = "none";


  showLogin();
}


// ================================
// CHECK USER
// ================================

async function checkUser() {

  const { data } =
    await supabaseClient.auth.getUser();


  if (data.user) {

    showDashboard(data.user);

  }
}


// START
checkUser();

</script>

</body>
</html>
