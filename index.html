<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XALLO-GAMING</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:radial-gradient(circle at top,#123b5d,#050713 65%);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:430px;
  background:rgba(17,24,45,.98);
  border:1px solid #263553;
  border-radius:25px;
  padding:30px 25px;
  box-shadow:0 0 40px rgba(0,170,255,.18);
}

.logo{
  text-align:center;
  font-size:34px;
  font-weight:bold;
  margin-bottom:8px;
}

.logo span{
  color:#08a9ff;
}

.subtitle{
  text-align:center;
  color:#9da8bd;
  margin-bottom:30px;
}

h2{
  margin-bottom:20px;
}

input{
  width:100%;
  padding:16px;
  margin-bottom:14px;
  border-radius:13px;
  border:1px solid #283653;
  background:#070b19;
  color:white;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#08a9ff;
}

button{
  width:100%;
  padding:16px;
  border:0;
  border-radius:13px;
  background:#08a9ff;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  margin-top:8px;
}

button:disabled{
  opacity:.6;
}

.switch{
  text-align:center;
  margin-top:22px;
  color:#9da8bd;
}

.switch a{
  color:#08a9ff;
  font-weight:bold;
  cursor:pointer;
}

.message{
  margin-top:18px;
  padding:12px;
  border-radius:10px;
  text-align:center;
  display:none;
  line-height:1.5;
}

.success{
  display:block;
  color:#55e6a5;
  background:rgba(0,200,120,.12);
}

.error{
  display:block;
  color:#ff7777;
  background:rgba(255,60,60,.12);
}

.dashboard{
  display:none;
  text-align:center;
}

.email{
  color:#b8c1d4;
  margin:15px 0;
  word-break:break-word;
}

.coins{
  margin:25px 0 15px;
  padding:22px;
  border-radius:18px;
  background:#0c1b2e;
  border:1px solid #315174;
}

.coin-number{
  color:#ffd54a;
  font-size:40px;
  font-weight:bold;
  margin-top:8px;
}

.coin-button{
  background:#16b978;
}

.reward-button{
  background:#9c27b0;
}

.logout{
  background:#e53935;
}

.info{
  color:#8f9bb3;
  font-size:13px;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<div id="authBox">

  <div class="logo">
    XALLO-<span>GAMING</span>
  </div>

  <div class="subtitle">
    Play • Earn • Enjoy
  </div>

  <div id="loginBox">

    <h2>Login</h2>

    <input
      id="loginEmail"
      type="email"
      placeholder="Email"
      autocomplete="email">

    <input
      id="loginPassword"
      type="password"
      placeholder="Password"
      autocomplete="current-password">

    <button id="loginButton" onclick="login()">
      Login
    </button>

    <div class="switch">
      Don't have an account?
      <a onclick="showSignup()">Sign Up</a>
    </div>

  </div>

  <div id="signupBox" style="display:none;">

    <h2>Create Account</h2>

    <input
      id="signupEmail"
      type="email"
      placeholder="Email"
      autocomplete="email">

    <input
      id="signupPassword"
      type="password"
      placeholder="Password"
      autocomplete="new-password">

    <button id="signupButton" onclick="signup()">
      Sign Up
    </button>

    <div class="switch">
      Already have an account?
      <a onclick="showLogin()">Login</a>
    </div>

  </div>

  <div id="message" class="message"></div>

</div>


<div id="dashboard" class="dashboard">

  <div class="logo">
    XALLO-<span>GAMING</span>
  </div>

  <div class="subtitle">
    Play • Earn • Enjoy
  </div>

  <h2>Welcome 🎮</h2>

  <div class="email" id="userEmail"></div>

  <div class="coins">

    🪙 Your Coins

    <div class="coin-number" id="coins">
      0
    </div>

  </div>

  <button
    class="coin-button"
    id="coinButton"
    onclick="addCoins()">
    🎁 Get 10 Coins
  </button>

  <button
    class="reward-button"
    id="rewardButton"
    onclick="dailyReward()">
    🎁 Daily Reward +10
  </button>

  <div id="dashboardMessage" class="message"></div>

  <div class="info">
    Daily Reward can be claimed once per day.
  </div>

  <button class="logout" onclick="logout()">
    Logout
  </button>

</div>

</div>


<script>

/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
"https://vnyprsjjmmjahkisozib.supabase.co";

const SUPABASE_KEY =
"sb_publishable_ixrANIhgAIwrxkyRL94YAw_iegjwNYp";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ================================
   MESSAGES
================================ */

function showMessage(text,type){

  const box =
    document.getElementById("message");

  box.textContent=text;
  box.className="message "+type;
}

function dashboardMessage(text,type){

  const box =
    document.getElementById("dashboardMessage");

  box.textContent=text;
  box.className="message "+type;
}


/* ================================
   LOCAL DATE
================================ */

function getLocalDate(){

  const now=new Date();

  return now.getFullYear()+"-"+
    String(now.getMonth()+1).padStart(2,"0")+"-"+
    String(now.getDate()).padStart(2,"0");
}


/* ================================
   LOGIN / SIGNUP SCREEN
================================ */

function showLogin(){

  document.getElementById("loginBox")
    .style.display="block";

  document.getElementById("signupBox")
    .style.display="none";

  document.getElementById("message")
    .style.display="none";
}

function showSignup(){

  document.getElementById("loginBox")
    .style.display="none";

  document.getElementById("signupBox")
    .style.display="block";

  document.getElementById("message")
    .style.display="none";
}


/* ================================
   CREATE PROFILE
================================ */

async function createUserProfile(email){

  const {data:existing,error:selectError} =
    await supabaseClient
      .from("users")
      .select("email")
      .eq("email",email)
      .maybeSingle();

  if(selectError){

    console.log(
      "Profile check:",
      selectError.message
    );

    return;
  }

  if(existing){

    return;
  }

  const {error} =
    await supabaseClient
      .from("users")
      .insert({
        email:email,
        username:email.split("@")[0]
      });

  if(error){

    console.log(
      "Profile:",
      error.message
    );
  }
}


/* ================================
   SIGN UP
================================ */

async function signup(){

  const email =
    document.getElementById("signupEmail")
      .value.trim();

  const password =
    document.getElementById("signupPassword")
      .value;

  if(!email || !password){

    showMessage(
      "Enter email and password.",
      "error"
    );

    return;
  }

  if(password.length<6){

    showMessage(
      "Password must be at least 6 characters.",
      "error"
    );

    return;
  }

  const button =
    document.getElementById("signupButton");

  button.disabled=true;
  button.textContent="Creating...";

  const {data,error} =
    await supabaseClient.auth.signUp({
      email:email,
      password:password
    });

  button.disabled=false;
  button.textContent="Sign Up";

  if(error){

    showMessage(
      error.message,
      "error"
    );

    return;
  }

  /*
    Profile is created only when
    a session is available.
  */

  if(data && data.session && data.user){

    await createUserProfile(
      data.user.email
    );

    await showDashboard(
      data.user
    );

    return;
  }

  showMessage(
    "Account created! Check your email to confirm your account.",
    "success"
  );

  document.getElementById("signupEmail")
    .value="";

  document.getElementById("signupPassword")
    .value="";
}


/* ================================
   LOGIN
================================ */

async function login(){

  const email =
    document.getElementById("loginEmail")
      .value.trim();

  const password =
    document.getElementById("loginPassword")
      .value;

  if(!email || !password){

    showMessage(
      "Enter email and password.",
      "error"
    );

    return;
  }

  const button =
    document.getElementById("loginButton");

  button.disabled=true;
  button.textContent="Logging in...";

  const {data,error} =
    await supabaseClient.auth
      .signInWithPassword({
        email:email,
        password:password
      });

  button.disabled=false;
  button.textContent="Login";

  if(error){

    showMessage(
      error.message,
      "error"
    );

    return;
  }

  if(data && data.user){

    /*
      IMPORTANT:
      We do NOT reset coins here.
    */

    await createUserProfile(
      data.user.email
    );

    await showDashboard(
      data.user
    );
  }
}


/* ================================
   LOAD COINS
================================ */

async function loadCoins(user){

  const {data,error} =
    await supabaseClient
      .from("users")
      .select("coins")
      .eq("email",user.email)
      .maybeSingle();

  if(!error && data){

    document.getElementById("coins")
      .textContent=
        Number(data.coins)||0;

  }else{

    document.getElementById("coins")
      .textContent="0";

    console.log(
      "Load coins:",
      error?.message
    );
  }
}


/* ================================
   DASHBOARD
================================ */

async function showDashboard(user){

  document.getElementById("authBox")
    .style.display="none";

  document.getElementById("dashboard")
    .style.display="block";

  document.getElementById("userEmail")
    .textContent=user.email;

  await loadCoins(user);

  await checkDailyRewardButton(user);
}


/* ================================
   CHECK DAILY REWARD
================================ */

async function checkDailyRewardButton(user){

  const {data,error} =
    await supabaseClient
      .from("users")
      .select("last_reward_date")
      .eq("email",user.email)
      .maybeSingle();

  if(error || !data){

    return;
  }

  const today=getLocalDate();

  const button =
    document.getElementById("rewardButton");

  if(data.last_reward_date===today){

    button.disabled=true;
    button.textContent="✅ Reward Claimed";

  }else{

    button.disabled=false;
    button.textContent="🎁 Daily Reward +10";
  }
}


/* ================================
   GET 10 COINS
================================ */

async function addCoins(){

  const {data:userData} =
    await supabaseClient.auth.getUser();

  if(!userData.user){

    return;
  }

  const email=userData.user.email;

  const button =
    document.getElementById("coinButton");

  button.disabled=true;
  button.textContent="Adding...";

  const {data,error} =
    await supabaseClient
      .from("users")
      .select("coins")
      .eq("email",email)
      .maybeSingle();

  if(error || !data){

    button.disabled=false;
    button.textContent="🎁 Get 10 Coins";

    dashboardMessage(
      "User profile not found.",
      "error"
    );

    return;
  }

  const newCoins =
    (Number(data.coins)||0)+10;

  const {error:updateError} =
    await supabaseClient
      .from("users")
      .update({
        coins:newCoins
      })
      .eq("email",email);

  button.disabled=false;
  button.textContent="🎁 Get 10 Coins";

  if(updateError){

    dashboardMessage(
      updateError.message,
      "error"
    );

    return;
  }

  document.getElementById("coins")
    .textContent=newCoins;

  dashboardMessage(
    "🎉 10 Coins added!",
    "success"
  );
}


/* ================================
   DAILY REWARD
================================ */

async function dailyReward(){

  const {data:userData} =
    await supabaseClient.auth.getUser();

  if(!userData.user){

    return;
  }

  const email=userData.user.email;

  const button =
    document.getElementById("rewardButton");

  button.disabled=true;
  button.textContent="Checking...";

  const {data,error} =
    await supabaseClient
      .from("users")
      .select("coins,last_reward_date")
      .eq("email",email)
      .maybeSingle();

  if(error || !data){

    button.disabled=false;
    button.textContent="🎁 Daily Reward +10";

    dashboardMessage(
      "User profile not found.",
      "error"
    );

    return;
  }

  const today=getLocalDate();

  if(data.last_reward_date===today){

    button.disabled=true;
    button.textContent="✅ Reward Claimed";

    dashboardMessage(
      "🎁 You already claimed today's reward.",
      "error"
    );

    return;
  }

  const newCoins =
    (Number(data.coins)||0)+10;

  const {error:updateError} =
    await supabaseClient
      .from("users")
      .update({
        coins:newCoins,
        last_reward_date:today
      })
      .eq("email",email);

  if(updateError){

    button.disabled=false;
    button.textContent="🎁 Daily Reward +10";

    dashboardMessage(
      updateError.message,
      "error"
    );

    return;
  }

  document.getElementById("coins")
    .textContent=newCoins;

  button.disabled=true;
  button.textContent="✅ Reward Claimed";

  dashboardMessage(
    "🎉 Daily Reward: +10 Coins!",
    "success"
  );
}


/* ================================
   LOGOUT
================================ */

async function logout(){

  await supabaseClient.auth.signOut();

  document.getElementById("dashboard")
    .style.display="none";

  document.getElementById("authBox")
    .style.display="block";

  showLogin();
}


/* ================================
   CHECK USER
================================ */

async function checkUser(){

  const {data} =
    await supabaseClient.auth.getUser();

  if(data && data.user){

    await showDashboard(
      data.user
    );
  }
}


/* ================================
   START
================================ */

checkUser();

</script>

</body>
</html>
