<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XALLO-GAMING</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
body {
  min-height: 100vh;
  background: radial-gradient(circle at top, #102a45, #050713 60%);
  color: white;
  display: flex; justify-content: center; align-items: center;
  padding: 20px;
}
.container {
  width: 100%; max-width: 430px;
  background: rgba(17, 24, 45, .97);
  border: 1px solid #263553; border-radius: 25px;
  padding: 32px 25px;
  box-shadow: 0 0 40px rgba(0,170,255,.18);
}
.logo { text-align: center; font-size: 34px; font-weight: bold; margin-bottom: 8px; }
.logo span { color: #08a9ff; }
.subtitle { text-align: center; color: #9da8bd; margin-bottom: 30px; }
h2 { margin-bottom: 20px; }
input {
  width: 100%; padding: 16px; margin-bottom: 14px;
  border-radius: 13px; border: 1px solid #283653;
  background: #070b19; color: white; font-size: 16px; outline: none;
}
button {
  width: 100%; padding: 16px; border: 0; border-radius: 13px;
  background: #08a9ff; color: white; font-size: 17px;
  font-weight: bold; cursor: pointer; margin-top: 5px;
}
button:disabled { opacity: 0.6; }
.switch { text-align: center; margin-top: 22px; color: #9da8bd; }
.switch a { color: #08a9ff; font-weight: bold; cursor: pointer; }
.message {
  margin-top: 18px; padding: 12px; border-radius: 10px;
  text-align: center; display: none;
}
.success { display: block; color: #55e6a5; background: rgba(0,200,120,.12); }
.error { display: block; color: #ff7777; background: rgba(255,60,60,.12); }
.dashboard { display: none; text-align: center; }
.email { color: #b8c1d4; margin: 15px 0; word-break: break-word; }
.coins {
  margin: 25px 0; padding: 22px; border-radius: 18px;
  background: #0c1b2e; border: 1px solid #315174;
}
.coin-number { color: #ffd54a; font-size: 40px; font-weight: bold; margin-top: 8px; }
.logout { background: #e53935; }
</style>
</head>
<body>

<div class="container">

  <div id="authBox">
    <div class="logo">XALLO-<span>GAMING</span></div>
    <div class="subtitle">Play • Earn • Enjoy</div>

    <div id="loginBox">
      <h2>Login</h2>
      <input id="loginEmail" type="email" placeholder="Email">
      <input id="loginPassword" type="password" placeholder="Password">
      <button id="loginBtn" onclick="doLogin()">Login</button>
      <div class="switch">Don't have an account? <a onclick="showSignup()">Sign Up</a></div>
    </div>

    <div id="signupBox" style="display:none;">
      <h2>Create Account</h2>
      <input id="signupEmail" type="email" placeholder="Email">
      <input id="signupPassword" type="password" placeholder="Password">
      <button id="signupBtn" onclick="doSignup()">Sign Up</button>
      <div class="switch">Already have an account? <a onclick="showLogin()">Login</a></div>
    </div>

    <div id="message" class="message"></div>
  </div>

  <div id="dashboard" class="dashboard">
    <div class="logo">XALLO-<span>GAMING</span></div>
    <div class="subtitle">Play • Earn • Enjoy</div>
    <div class="email" id="userEmail"></div>
    <div class="coins">
      🪙 Your Coins
      <div class="coin-number" id="coins">0</div>
    </div>
    <button id="earnBtn" onclick="doEarn()" style="background: #10b981;">+ 10 Coins</button>
    <button class="logout" onclick="doLogout()" style="margin-top: 10px;">Logout</button>
  </div>

</div>

<script>
var SUPABASE_URL = "https://vnyprsjjmmjahkisozib.supabase.co";
var SUPABASE_KEY = "sb_publishable_ixrANIhgAIwrxkyRL94YAw_iegjwNYp";
var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function el(id) { return document.getElementById(id); }

function showMessage(text, type) {
  var m = el("message");
  m.textContent = text;
  m.className = "message " + type;
}

function showSignup() {
  el("loginBox").style.display = "none";
  el("signupBox").style.display = "block";
  el("message").style.display = "none";
}

function showLogin() {
  el("loginBox").style.display = "block";
  el("signupBox").style.display = "none";
  el("message").style.display = "none";
}

async function doLogin() {
  var email = el("loginEmail").value.trim();
  var password = el("loginPassword").value;

  if (!email || !password) {
    showMessage("Enter email and password.", "error");
    return;
  }

  var btn = el("loginBtn");
  btn.disabled = true;
  btn.textContent = "Loading...";

  try {
    var res = await db.auth.signInWithPassword({ email: email, password: password });
    btn.disabled = false;
    btn.textContent = "Login";

    if (res.error) {
      showMessage(res.error.message, "error");
      return;
    }
    showDashboard(res.data.user);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "Login";
    showMessage("Error: " + e.message, "error");
  }
}

async function doSignup() {
  var email = el("signupEmail").value.trim();
  var password = el("signupPassword").value;

  if (!email || !password) {
    showMessage("Enter email and password.", "error");
    return;
  }
  if (password.length < 6) {
    showMessage("Password must be 6+ characters.", "error");
    return;
  }

  var btn = el("signupBtn");
  btn.disabled = true;
  btn.textContent = "Loading...";

  try {
    var res = await db.auth.signUp({ email: email, password: password });
    btn.disabled = false;
    btn.textContent = "Sign Up";

    if (res.error) {
      showMessage(res.error.message, "error");
      return;
    }
    showMessage("Account created! You can now login.", "success");
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "Sign Up";
    showMessage("Error: " + e.message, "error");
  }
}

async function showDashboard(user) {
  el("authBox").style.display = "none";
  el("dashboard").style.display = "block";
  el("userEmail").textContent = user.email;

  try {
    var res = await db.from("users").select("coins").eq("email", user.email).single();
    if (res.data) {
      el("coins").textContent = res.data.coins || 0;
    } else {
      await db.from("users").insert({ email: user.email, coins: 0 });
      el("coins").textContent = "0";
    }
  } catch (e) {
    el("coins").textContent = "0";
  }
}

async function doLogout() {
  await db.auth.signOut();
  el("dashboard").style.display = "none";
  el("authBox").style.display = "block";
  showLogin();
}

async function doEarn() {
  var email = el("userEmail").textContent;
  if (!email) return;

  var btn = el("earnBtn");
  btn.disabled = true;
  btn.textContent = "...";

  try {
    var res = await db.rpc("add_coins", { user_email: email, amount: 10 });
    if (res.error) {
      alert("Error: " + res.error.message);
      btn.disabled = false;
      btn.textContent = "+ 10 Coins";
      return;
    }
    el("coins").textContent = res.data;
    btn.disabled = false;
    btn.textContent = "+ 10 Coins";
  } catch (e) {
    alert("Error: " + e.message);
    btn.disabled = false;
    btn.textContent = "+ 10 Coins";
  }
}

// CHECK USER
(async function() {
  try {
    var res = await db.auth.getUser();
    if (res.data.user) showDashboard(res.data.user);
  } catch (e) {
    console.log("No user");
  }
})();
</script>

</body>
</html>
