<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XALLO-GAMING</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #070a18;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 450px;
      background: #11162b;
      padding: 35px 28px;
      border-radius: 25px;
      box-shadow: 0 0 40px rgba(0, 174, 255, 0.25);
    }

    .logo {
      text-align: center;
      font-size: 38px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .logo span {
      color: #00aaff;
    }

    .subtitle {
      text-align: center;
      color: #9ca3b8;
      font-size: 20px;
      margin-bottom: 40px;
    }

    h2 {
      font-size: 30px;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 18px;
      margin-bottom: 15px;
      border: 1px solid #29304d;
      border-radius: 15px;
      background: #080b1c;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #00aaff;
    }

    button {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 15px;
      background: #08a9f5;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button:hover {
      background: #008ed0;
    }

    .switch {
      text-align: center;
      margin-top: 25px;
      color: #aab0c5;
      font-size: 16px;
    }

    .switch span {
      color: #00aaff;
      cursor: pointer;
    }

    #message {
      text-align: center;
      margin-top: 18px;
      color: #00aaff;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">
      XALLO-<span>GAMING</span>
    </div>

    <div class="subtitle">
      Play • Earn • Enjoy
    </div>

    <!-- LOGIN -->
    <div id="loginPage">

      <h2>Login</h2>

      <input
        type="email"
        id="loginEmail"
        placeholder="Email"
      >

      <input
        type="password"
        id="loginPassword"
        placeholder="Password"
      >

      <button onclick="login()">
        Login
      </button>

      <div class="switch">
        Don't have an account?
        <span onclick="showSignup()">Sign Up</span>
      </div>

    </div>

    <!-- SIGN UP -->
    <div id="signupPage" style="display:none;">

      <h2>Create Account</h2>

      <input
        type="email"
        id="signupEmail"
        placeholder="Email"
      >

      <input
        type="password"
        id="signupPassword"
        placeholder="Password"
      >

      <button onclick="signup()">
        Sign Up
      </button>

      <div class="switch">
        Already have an account?
        <span onclick="showLogin()">Login</span>
      </div>

    </div>

    <div id="message"></div>

  </div>

<script>

const SUPABASE_URL =
"https://vnyprsjjmmjahkisozib.supabase.co";

const SUPABASE_KEY =
"sb_publishable_ixrANIhgAIwrxkyRL94YAw_iegjwNYp";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


// LOGIN
async function login() {

  const email =
    document.getElementById("loginEmail").value;

  const password =
    document.getElementById("loginPassword").value;

  const message =
    document.getElementById("message");

  if (!email || !password) {
    message.textContent =
      "Please enter email and password.";
    return;
  }

  message.textContent = "Logging in...";

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (error) {
    message.textContent =
      error.message;
    return;
  }

  message.textContent =
    "Login successful! 🎮";

}


// SIGN UP
async function signup() {

  const email =
    document.getElementById("signupEmail").value;

  const password =
    document.getElementById("signupPassword").value;

  const message =
    document.getElementById("message");

  if (!email || !password) {
    message.textContent =
      "Please enter email and password.";
    return;
  }

  if (password.length < 6) {
    message.textContent =
      "Password must be at least 6 characters.";
    return;
  }

  message.textContent =
    "Creating account...";

  const { data, error } =
    await supabaseClient.auth.signUp({
      email: email,
      password: password
    });

  if (error) {
    message.textContent =
      error.message;
    return;
  }

  message.textContent =
    "Account created! 🎉 Check your email.";

}


// SHOW SIGN UP
function showSignup() {

  document.getElementById("loginPage")
    .style.display = "none";

  document.getElementById("signupPage")
    .style.display = "block";

  document.getElementById("message")
    .textContent = "";

}


// SHOW LOGIN
function showLogin() {

  document.getElementById("signupPage")
    .style.display = "none";

  document.getElementById("loginPage")
    .style.display = "block";

  document.getElementById("message")
    .textContent = "";

}

</script>

</body>
</html>
