<!doctype html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XALLO-GAMING - گەڕان</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif;padding-bottom:80px}
header{padding:20px;text-align:center;border-bottom:1px solid #222;font-weight:bold;font-size:20px}
main{max-width:700px;margin:auto;padding:18px}
.search{display:flex;gap:8px}
input{flex:1;background:#171717;color:#fff;border:1px solid #333;border-radius:14px;padding:15px;font-size:16px}
button{border:0;border-radius:13px;padding:12px 18px;font-weight:bold;cursor:pointer}
.search button{background:#ff174f;color:#fff}
.tabs{display:flex;gap:8px;margin:16px 0}
.tabs button{flex:1;background:#181818;color:#aaa;border:1px solid #333}
.tabs button.active{background:#ff174f;color:#fff}
.item{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid #222}
.avatar{width:48px;height:48px;border-radius:50%;background:#252525;display:flex;align-items:center;justify-content:center;font-size:22px}
.info{flex:1}.name{font-weight:bold}.handle{color:#888;font-size:13px;margin-top:4px}
.view{background:#ff174f;color:white;padding:9px 15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid video{width:100%;aspect-ratio:9/14;object-fit:cover;background:#151515}
.message{text-align:center;color:#888;padding:60px 10px}
.nav{position:fixed;bottom:0;left:0;right:0;height:70px;background:#141414;border-top:1px solid #333;display:flex}
.nav a{flex:1;text-align:center;text-decoration:none;color:#aaa;font-size:12px;padding:9px 2px}
.nav a.active{color:#ff174f}.icon{display:block;font-size:22px;margin-bottom:4px}
</style>
</head>
<body>
<header>XALLO-GAMING 🎮</header>
<main>
<div class="search">
<input id="q" type="search" placeholder="بگەڕێ بە ناوی بەکارهێنەر..." autocomplete="off">
<button onclick="runSearch()">گەڕان</button>
</div>

<div class="tabs">
<button id="uTab" class="active" onclick="setTab('users')">👤 بەکارهێنەرەکان</button>
<button id="vTab" onclick="setTab('videos')">🎬 ڤیدیۆکان</button>
</div>

<div id="result" class="message">وشەیەک بنووسە و گەڕان بکە.</div>
</main>

<nav class="nav">
<a href="index.html"><span class="icon">🏠</span>سەرەکی</a>
<a class="active" href="search.html"><span class="icon">🔎</span>گەڕان</a>
<a href="index.html"><span class="icon">➕</span>بڵاوکردنەوە</a>
<a href="profile.html"><span class="icon">👤</span>پرۆفایل</a>
</nav>

<script>
const URL="https://vnyprsjjmmjahkisozib.supabase.co";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZueXByc2pqbW1qYWhraXNvemliIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5OTE0MjEsImV4cCI6MjEwNTU2NzQyMX0.-CqVI-DzAvgNE_qAa9fwRk12QXl0zMGw7hzqqmZE4sI";
const db=supabase.createClient(URL,KEY);
let tab="users";

function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function setTab(x){
 tab=x;
 uTab.classList.toggle("active",x==="users");
 vTab.classList.toggle("active",x==="videos");
 runSearch();
}
async function runSearch(){
 const q=document.getElementById("q").value.trim();
 const box=document.getElementById("result");
 if(!q){box.className="message";box.textContent="وشەیەک بنووسە و گەڕان بکە.";return}
 box.className="message";box.textContent="گەڕان دەکات...";
 if(tab==="users"){
  const r=await db.from("profiles").select("id,username,display_name,bio").or("username.ilike.%"+q+"%,display_name.ilike.%"+q+"%").limit(30);
  if(r.error){console.error(r.error);box.textContent="هەڵەیەک ڕوویدا لە گەڕان.";return}
  if(!r.data.length){box.textContent="هیچ بەکارهێنەرێک نەدۆزرایەوە.";return}
  box.className="";
  box.innerHTML=r.data.map(p=>'<div class="item"><div class="avatar">👤</div><div class="info"><div class="name">'+esc(p.display_name||p.username||"بەکارهێنەر")+'</div><div class="handle">'+(p.username?"@"+esc(p.username):"")+'</div></div><button class="view" onclick="openUser(''+esc(p.id)+'')">بینین</button></div>').join("");
 }else{
  const r=await db.from("videos").select("*").ilike("caption","%"+q+"%").order("created_at",{ascending:false}).limit(30);
  if(r.error){console.error(r.error);box.textContent="هەڵەیەک ڕوویدا لە گەڕانی ڤیدیۆ.";return}
  if(!r.data.length){box.textContent="هیچ ڤیدیۆیەک نەدۆزرایەوە.";return}
  box.className="grid";
  box.innerHTML=r.data.map(v=>'<video src="'+esc(v.video_url)+'" controls muted playsinline preload="metadata"></video>').join("");
 }
}
function openUser(id){location.href="user-profile.html?id="+encodeURIComponent(id)}
q.addEventListener("keydown",e=>{if(e.key==="Enter")runSearch()});
</script>
</body>
</html>
