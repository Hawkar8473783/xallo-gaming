<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XALLO-GAMING | پرۆفایل</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:#080808;color:#fff;font-family:Arial,"Noto Sans Arabic",sans-serif}
    body{padding-bottom:76px}
    button,input,textarea{font:inherit}
    .top{height:62px;border-bottom:1px solid #252525;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:800}
    .top .brand{font-size:19px}
    .top .back{color:#aaa;text-decoration:none;font-size:15px}
    .profile{text-align:center;padding:32px 16px 22px}
    .avatar{width:116px;height:116px;border-radius:50%;margin:auto;background:#202020;border:3px solid #3a3a3a;display:flex;align-items:center;justify-content:center;font-size:48px}
    .name{font-size:23px;font-weight:800;margin-top:14px}
    .username{color:#999;margin-top:5px}
    .bio{max-width:520px;margin:12px auto;color:#bbb;line-height:1.7}
    .stats{display:flex;justify-content:center;gap:42px;margin:22px 0}
    .stat strong{display:block;font-size:21px}
    .stat span{display:block;color:#999;font-size:13px;margin-top:5px}
    .actions{display:flex;justify-content:center;gap:10px}
    .btn{border:0;border-radius:13px;padding:12px 22px;font-weight:800;cursor:pointer}
    .btn.dark{background:#292929;color:#fff}
    .btn.pink{background:#ff174f;color:#fff}
    .section-title{border-top:1px solid #252525;border-bottom:2px solid #ff174f;padding:16px;text-align:center;font-size:18px;font-weight:800}
    .empty{text-align:center;color:#777;padding:70px 20px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:2px}
    .video{aspect-ratio:9/14;background:#151515;position:relative;overflow:hidden}
    .video video{width:100%;height:100%;object-fit:cover}
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:20;padding:22px}
    .box{max-width:520px;margin:55px auto 0;background:#171717;border:1px solid #303030;border-radius:18px;padding:22px}
    .box h2{margin-top:0}
    label{display:block;color:#aaa;font-size:14px;margin:14px 0 7px}
    input,textarea{width:100%;background:#0d0d0d;color:#fff;border:1px solid #383838;border-radius:12px;padding:12px;outline:none}
    textarea{min-height:110px;resize:vertical}
    .modal-actions{display:flex;gap:10px;margin-top:18px}
    .modal-actions button{flex:1}
    .nav{position:fixed;bottom:0;left:0;right:0;height:70px;background:#141414;border-top:1px solid #303030;display:flex;z-index:10}
    .nav a{flex:1;color:#999;text-decoration:none;text-align:center;padding-top:10px;font-size:12px}
    .nav a.active{color:#ff174f}
    .nav .icon{display:block;font-size:22px;margin-bottom:4px}
    .loading{text-align:center;color:#999;padding:60px 20px}
    @media(max-width:430px){
      .stats{gap:28px}
      .stat span{font-size:12px}
      .actions .btn{padding:11px 16px}
    }
  </style>
</head>
<body>

<header class="top">
  <a class="back" href="index.html">← گەڕانەوە</a>
  <div class="brand">XALLO-GAMING</div>
  <div style="width:70px"></div>
</header>

<main>
  <section class="profile">
    <div class="avatar" id="avatar">🎮</div>
    <div class="name" id="displayName">چاوەڕوان بە...</div>
    <div class="username" id="username"></div>
    <div class="bio" id="bio"></div>

    <div class="stats">
      <div class="stat"><strong id="followers">0</strong><span>شوێنکەوتوو</span></div>
      <div class="stat"><strong id="following">0</strong><span>شوێنکەوتووم</span></div>
      <div class="stat"><strong id="videoCount">0</strong><span>ڤیدیۆ</span></div>
    </div>

    <div class="actions">
      <button class="btn dark" onclick="openEdit()">✏️ دەستکاری پرۆفایل</button>
      <button class="btn pink" onclick="logout()">🚪 دەرچوون</button>
    </div>
  </section>

  <div class="section-title">🎬 ڤیدیۆکانی من</div>
  <div id="videos" class="loading">چاوەڕوان بە...</div>
</main>

<div class="modal" id="editModal">
  <div class="box">
    <h2>دەستکاری پرۆفایل</h2>

    <label>ناوی پیشاندان</label>
    <input id="editDisplayName" maxlength="40" placeholder="ناوت">

    <label>ناوی بەکارهێنەر</label>
    <input id="editUsername" maxlength="30" placeholder="username">

    <label>بایۆ</label>
    <textarea id="editBio" maxlength="160" placeholder="کەمێک دەربارەی خۆت بنووسە..."></textarea>

    <div class="modal-actions">
      <button class="btn dark" onclick="closeEdit()">پاشگەزبوونەوە</button>
      <button class="btn pink" onclick="saveProfile()">پاشەکەوتکردن</button>
    </div>
  </div>
</div>

<nav class="nav">
  <a href="index.html"><span class="icon">🏠</span>سەرەکی</a>
  <a href="index.html"><span class="icon">🔎</span>گەڕان</a>
  <a href="index.html"><span class="icon">➕</span>بڵاوکردنەوە</a>
  <a href="index.html"><span class="icon">🔔</span>ئاگادارکردنەوە</a>
  <a class="active" href="profile.html"><span class="icon">👤</span>پرۆفایل</a>
</nav>

<script>
const SUPABASE_URL = "https://vnyprsjjmmjahkisozib.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZueXByc2pqbW1qYWhraXNvemliIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5OTE0MjEsImV4cCI6MjEwNTU2NzQyMX0.-CqVI-DzAvgNE_qAa9fwRk12QXl0zMGw7hzqqmZE4sI";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser = null;
let profileData = null;

async function init(){
  const {data:{session}} = await supabaseClient.auth.getSession();

  if(!session){
    location.href = "index.html";
    return;
  }

  currentUser = session.user;
  await loadProfile();
  await loadVideos();
}

async function loadProfile(){
  const {data,error} = await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id", currentUser.id)
    .maybeSingle();

  if(error){
    console.error(error);
    document.getElementById("displayName").textContent = "هەڵەیەک ڕوویدا";
    return;
  }

  if(!data){
    const newProfile = {
      id: currentUser.id,
      username: currentUser.email ? currentUser.email.split("@")[0] : "user",
      display_name: currentUser.email ? currentUser.email.split("@")[0] : "user",
      bio: ""
    };

    const {data:created,error:createError} = await supabaseClient
      .from("profiles")
      .insert(newProfile)
      .select()
      .single();

    if(createError){
      console.error(createError);
      profileData = newProfile;
    }else{
      profileData = created;
    }
  }else{
    profileData = data;
  }

  renderProfile();
}

async function renderProfile(){
  const p = profileData || {};

  document.getElementById("displayName").textContent =
    p.display_name || p.username || "بەکارهێنەر";

  document.getElementById("username").textContent =
    p.username ? "@" + p.username : "";

  document.getElementById("bio").textContent =
    p.bio || "";

  const {count:followersCount} = await supabaseClient
    .from("follows")
    .select("*",{count:"exact",head:true})
    .eq("following_id", currentUser.id);

  const {count:followingCount} = await supabaseClient
    .from("follows")
    .select("*",{count:"exact",head:true})
    .eq("follower_id", currentUser.id);

  document.getElementById("followers").textContent = followersCount || 0;
  document.getElementById("following").textContent = followingCount || 0;
}

async function loadVideos(){
  const container = document.getElementById("videos");

  const {data,error} = await supabaseClient
    .from("videos")
    .select("*")
    .eq("user_id", currentUser.id)
    .order("created_at",{ascending:false});

  if(error){
    console.error(error);
    container.className = "empty";
    container.textContent = "نەتوانرا ڤیدیۆکان باربکرێن.";
    return;
  }

  document.getElementById("videoCount").textContent = data.length;

  if(!data.length){
    container.className = "empty";
    container.textContent = "هیچ ڤیدیۆیەکت نییە لە ئێستادا.";
    return;
  }

  container.className = "grid";
  container.innerHTML = data.map(v => `
    <div class="video">
      <video src="${escapeHtml(v.video_url || "")}" muted playsinline controls preload="metadata"></video>
    </div>
  `).join("");
}

function escapeHtml(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function openEdit(){
  const p = profileData || {};
  document.getElementById("editDisplayName").value = p.display_name || "";
  document.getElementById("editUsername").value = p.username || "";
  document.getElementById("editBio").value = p.bio || "";
  document.getElementById("editModal").style.display = "block";
}

function closeEdit(){
  document.getElementById("editModal").style.display = "none";
}

async function saveProfile(){
  const display_name = document.getElementById("editDisplayName").value.trim();
  const username = document.getElementById("editUsername").value.trim().replace(/\s+/g,"");
  const bio = document.getElementById("editBio").value.trim();

  if(!username){
    alert("تکایە ناوی بەکارهێنەر بنووسە.");
    return;
  }

  const {data,error} = await supabaseClient
    .from("profiles")
    .upsert({
      id: currentUser.id,
      display_name,
      username,
      bio
    })
    .select()
    .single();

  if(error){
    console.error(error);
    alert("پاشەکەوتکردن سەرکەوتوو نەبوو.");
    return;
  }

  profileData = data;
  closeEdit();
  await renderProfile();
}

async function logout(){
  await supabaseClient.auth.signOut();
  location.href = "index.html";
}

document.getElementById("editModal").addEventListener("click",function(e){
  if(e.target === this) closeEdit();
});

init();
</script>
</body>
</html>
