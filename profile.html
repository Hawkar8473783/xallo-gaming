<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>XALLO-GAMING | پرۆفایل</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #000; color: #fff; min-height: 100vh; padding-bottom: 70px; }

        .profile-header {
            display: flex; flex-direction: column; align-items: center; padding: 30px 20px 10px; text-align: center;
        }

        .avatar {
            width: 90px; height: 90px; border-radius: 50%; background: #222; border: 2px solid #333;
            display: flex; justify-content: center; align-items: center; font-size: 2.5rem; margin-bottom: 12px;
        }

        .username { font-size: 1.2rem; font-weight: bold; margin-bottom: 4px; }
        .email { font-size: 0.8rem; color: #888; margin-bottom: 15px; }

        /* بەشی زانیاری سکە و کۆدی ڕیفراڵ */
        .rewards-card {
            background: #161616; border: 1px solid #2a2a2a; border-radius: 16px;
            width: 90%; max-width: 400px; padding: 16px; margin: 10px auto;
            display: flex; flex-direction: column; gap: 12px; text-align: center;
        }

        .coin-box {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            font-size: 1.1rem; color: #ffd700; font-weight: bold;
        }

        .referral-box {
            background: #0d0d0d; padding: 10px; border-radius: 10px; border: 1px dashed #444;
            display: flex; justify-content: space-between; align-items: center;
        }

        .referral-title { font-size: 0.75rem; color: #aaa; margin-bottom: 4px; text-align: right; }
        .referral-code { font-weight: bold; letter-spacing: 1px; color: #00e5ff; font-size: 0.95rem; }

        .copy-btn {
            background: #fe2c55; border: none; color: white; padding: 6px 12px;
            border-radius: 8px; font-size: 0.75rem; font-weight: bold; cursor: pointer;
        }

        .action-btns { display: flex; gap: 10px; margin-top: 10px; }
        .btn-edit { background: #222; border: 1px solid #444; color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; }
        .btn-logout { background: #fe2c55; border: none; color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background-color: rgba(30, 30, 30, 0.95); backdrop-filter: blur(10px);
            display: flex; justify-content: space-around; padding: 6px 0;
            border-top: 1px solid #333; padding-bottom: calc(6px + env(safe-area-inset-bottom));
            z-index: 100;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #888; text-decoration: none; font-size: 0.6rem; gap: 2px; }
        .nav-item.active { color: #fe2c55; }
        .nav-item span { font-size: 1rem; }
    </style>
</head>
<body>

    <div class="profile-header">
        <div class="avatar">🎮</div>
        <div class="username" id="dispUsername">نایاساسی</div>
        <div class="email" id="dispEmail">...</div>

        <!-- ئەرکی سکە و کۆدی ڕیفراڵ -->
        <div class="rewards-card">
            <div class="coin-box">
                <span>🪙</span>
                <span>سکەکانت:</span>
                <span id="userCoins">0</span>
            </div>
            
            <div>
                <div class="referral-title">کۆدی ڕیفراڵەکەت (بۆ بانگهێشتکردنی هاوڕێیان):</div>
                <div class="referral-box">
                    <span class="referral-code" id="userReferralCode">------</span>
                    <button class="copy-btn" onclick="copyCode()">کۆپی</button>
                </div>
            </div>
        </div>

        <div class="action-btns">
            <button class="btn-edit">دەستکاری پرۆفایل ✏️</button>
            <button class="btn-logout" onclick="logout()">دەرچوون 🚪</button>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="index.html" class="nav-item"><span>🏠</span><span>ماڵەوە</span></a>
        <a href="search.html" class="nav-item"><span>🔍</span><span>گەڕان</span></a>
        <a href="index.html" class="nav-item"><span>➕</span><span>بڵاوکردنەوە</span></a>
        <a href="#" class="nav-item"><span>💬</span><span>نامەکان</span></a>
        <a href="profile.html" class="nav-item active"><span>👤</span><span>پرۆفایل</span></a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://vnyprsjjmmjahkisozib.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZueXByc2pqbW1qYWhraXNvemliIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5OTE0MjEsImV4cCI6MjEwNTU2NzQyMX0.-CqVI-DzAvgNE_qAa9fwRk12QXl0zMGw7hzqqmZE4sI";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadProfile() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            if (!session) {
                window.location.href = "index.html";
                return;
            }

            const user = session.user;
            document.getElementById("dispEmail").textContent = user.email;

            // هێنانی زانیارییەکان لە خشتەی profiles
            const { data: profile, error } = await supabaseClient
                .from("profiles")
                .select("username, coins, referral_code")
                .eq("id", user.id)
                .single();

            if (profile) {
                document.getElementById("dispUsername").textContent = profile.username || user.email.split("@")[0];
                document.getElementById("userCoins").textContent = profile.coins || 0;
                document.getElementById("userReferralCode").textContent = profile.referral_code || "کۆد نییە";
            }
        }

        function copyCode() {
            const code = document.getElementById("userReferralCode").textContent;
            if (code && code !== "------" && code !== "کۆد نییە") {
                navigator.clipboard.writeText(code);
                alert("کۆدی ڕیفراڵەکەت کۆپی کرا!");
            }
        }

        async function logout() {
            if (confirm("دەتەوێت بچیتە دەرەوە؟")) {
                await supabaseClient.auth.signOut();
                window.location.href = "index.html";
            }
        }

        loadProfile();
    </script>
</body>
</html>
